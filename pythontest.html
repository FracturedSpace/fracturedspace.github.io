<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python in HTML</title>
    <!-- Include PyScript Assets -->
    <link rel="stylesheet" href="https://pyscript.net">
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <h1>My First PyScript App</h1>
    
    <!-- Write Python inside this script tag -->
    <script type="py">
        from datetime import datetime
        print(f"Hello from Python! The current time is: {datetime.now()}")
    </script>

</body>
</html>
